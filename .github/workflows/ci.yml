name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get package dependencies
        run: flutter pub get

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check package versions
        run: bash tool/check_versions.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test package
        run: flutter test --coverage

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Publish dry run
        run: dart pub publish --dry-run

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'example/android/**/*.gradle', 'example/android/**/*.gradle.kts', 'example/android/gradle/wrapper/gradle-wrapper.properties', 'example/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android packages
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -path "*/bin/sdkmanager" -type f | head -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" "platforms;android-36" "ndk;27.0.12077973"

      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

      - name: Test Android plugin
        working-directory: example/android
        run: ./gradlew :plaid_link_flutter:testDebugUnitTest

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify LinkKit framework
        run: bash tool/validate_linkkit.sh

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Lint podspec
        working-directory: ios
        run: pod lib lint plaid_link_flutter.podspec --allow-warnings --skip-import-validation --no-clean

      - name: Build iOS simulator example
        working-directory: example
        run: flutter build ios --simulator --no-codesign

      - name: Run iOS unit tests
        working-directory: example
        run: |
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO
